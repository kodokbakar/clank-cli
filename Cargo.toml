[package]
name = "clank-cli"
version = "0.2.2"
edition = "2024"
description = "HTTP load testing CLI built with Rust"
license = "MIT"
repository = "https://github.com/kodokbakar/clank-cli"
homepage = "https://github.com/kodokbakar/clank-cli"
readme = "README.md"
keywords = ["cli", "load-testing", "http", "benchmark", "rust"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
console = "0.16.3"
hdrhistogram = "7"
indicatif = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
regex = "1"

[dev-dependencies]
httpmock = "0.8.3"

[profile.test]
opt-level = 0
debug = true
incremental = true
lto = false
codegen-units = 256

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true