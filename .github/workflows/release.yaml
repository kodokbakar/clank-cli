name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.gz
            binary_ext: ''
          - target: x86_64-apple-darwin
            os: macos-latest
            archive_ext: tar.gz
            binary_ext: ''
          - target: aarch64-apple-darwin
            os: macos-latest
            archive_ext: tar.gz
            binary_ext: ''
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_ext: zip
            binary_ext: .exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          name="$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"

          if [ -z "$name" ] || [ -z "$version" ]; then
            echo "Failed to read package name/version from Cargo.toml" >&2
            exit 1
          fi

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          package="${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}-${{ matrix.target }}"
          binary="target/${{ matrix.target }}/release/${{ steps.package.outputs.name }}"

          mkdir -p "dist/$package"
          cp "$binary" "dist/$package/"
          cp README.md "dist/$package/"
          cp LICENSE.md "dist/$package/"

          tar -czf "dist/$package.tar.gz" -C dist "$package"

          (
            cd dist
            shasum -a 256 "$package.tar.gz" > "$package.tar.gz.sha256"
          )

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}-${{ matrix.target }}"
          $binary = "target/${{ matrix.target }}/release/${{ steps.package.outputs.name }}${{ matrix.binary_ext }}"

          New-Item -ItemType Directory -Path "dist/$package" -Force | Out-Null
          Copy-Item $binary "dist/$package/"
          Copy-Item "README.md" "dist/$package/"
          Copy-Item "LICENSE.md" "dist/$package/"

          Compress-Archive -Path "dist/$package" -DestinationPath "dist/$package.zip" -Force

          $hash = Get-FileHash "dist/$package.zip" -Algorithm SHA256
          "$($hash.Hash.ToLower())  $package.zip" | Out-File -Encoding ascii "dist/$package.zip.sha256"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: clank-cli-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract release notes
        shell: bash
        run: |
          awk '
            /^## \[0\.2\.0\]/ { capture = 1; next }
            /^## \[/ && capture { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "Failed to extract v0.2.0 release notes from CHANGELOG.md" >&2
            exit 1
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show release artifacts
        run: ls -lah dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v0.2.0 — Rate Limiting
          body_path: release-notes.md
          files: dist/*
